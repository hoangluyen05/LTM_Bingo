services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bingo_online
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local}
    volumes:
      - bingo_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 25
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/bingo_online?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-local}
      TOKEN_SECRET: ${TOKEN_SECRET:-change-this-token-secret-for-production-1234567890}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
volumes:
  bingo_mysql:
